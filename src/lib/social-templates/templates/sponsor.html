<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* GSI's wordmark is set in Trebuchet MS. The renderer builds the page
     with setContent() and no base URL, and the Linux Chromium it runs on
     has no system Trebuchet — so the face has to be fetched by absolute
     URL, the same way the town and wayfinding share images do it. */
  @font-face {
    font-family: 'Trebuchet MS';
    src: url('https://www.gogreenstreets.org/fonts/trebuchet-regular.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Trebuchet MS';
    src: url('https://www.gogreenstreets.org/fonts/trebuchet-bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }

  :root {
    --navy: #191A2E; --navy-2: #20223A;
    --soft-white: #E8E8EE; --soft-white-2: #CBCCDA;
    --lime: #BAF14D;
    --blue: #2966E5;
    --forest-lt: #52B788;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
    --w: {{__width__}}px; --h: {{__height__}}px;

    /* Tier accent — drives the headline's second line. */
    --tier-color: {{tier_color}};
    /* Campaign accent — drives the eyebrow. Defaults to brand lime;
       pass a seasonal hue (summer gold, autumn orange) when it fits. */
    --campaign-color: {{campaign_color}};
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: var(--w); height: var(--h);
    overflow: hidden;
    background: var(--navy);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    color: var(--soft-white);
  }

  /* ---- Card frame ---- */
  .sx-card {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .sx-pad { padding: 88px; }

  .accent-stripe {
    position: absolute; top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--lime), var(--blue));
  }

  /* ---- Eyebrow: campaign name ---- */
  .sx-eyebrow {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--campaign-color);
    display: inline-flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .sx-eyebrow svg { flex-shrink: 0; }

  /* ---- Headline: the gratitude line ---- */
  .headline {
    margin-top: 56px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    color: #fff;
  }
  .headline .tier {
    display: block;
    color: var(--tier-color);
  }

  /* ---- Logo tile — the visual hero ----
     Full content width, generous height. The logo scales to the tile
     rather than being boxed into a square, so wide horizontal lockups
     (most sponsor logos) render large instead of shrinking to fit. */
  .logo-tile {
    margin-top: 52px;
    width: 100%;
    height: 330px;
    background: #fff;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 72px;
    flex: 0 0 auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
  }
  .logo-tile img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Sponsor name — shown under the tile only when the logo has no
     wordmark of its own. Preprocessed to empty when show_name is false. */
  .sponsor-name {
    margin-top: 32px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 46px;
    letter-spacing: -0.025em;
    color: #fff;
    text-align: center;
  }
  .sponsor-name:empty { display: none; }

  /* ---- Impact line — one sentence, no more ---- */
  .impact-text {
    margin-top: 44px;
    font-family: var(--display);
    font-weight: 400;
    font-size: 36px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: var(--soft-white);
  }

  /* ---- Proof strip ---- */
  .bottom { margin-top: auto; }

  .stats {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    border-top: 3px solid rgba(232,232,238,0.16);
    border-bottom: 3px solid rgba(232,232,238,0.16);
    padding: 36px 0;
    margin-bottom: 40px;
  }
  .stats:empty { display: none; }
  .stat { flex: 1; }
  .stat-value {
    font-family: var(--display);
    font-weight: 800;
    font-size: 72px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--lime);
  }
  .stat-label {
    margin-top: 12px;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
  }

  .cta {
    display: none;
    margin-bottom: 36px;
    background: var(--lime);
    color: var(--navy);
    border-radius: 9999px;
    padding: 18px 34px;
    font-family: var(--display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  [data-platform="facebook"] .cta:not(:empty) { display: inline-flex; }
  [data-platform="linkedin"] .cta:not(:empty) { display: inline-flex; }

  /* ---- Footer: GSI wordmark (always visible) + Shift lockup ---- */
  .sx-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .gsi-wordmark {
    font-family: 'Trebuchet MS', 'Lucida Grande', Verdana, sans-serif;
    font-size: 30px;
    letter-spacing: 0.5px;
  }
  .gsi-wordmark .green-streets { font-weight: 700; color: var(--forest-lt); }
  .gsi-wordmark .initiative { font-weight: 400; color: #fff; }
</style>
</head>
<body>
  <div class="sx-card sx-pad" data-platform="{{__platform__}}" data-ratio="{{__ratio__}}">
    <div class="accent-stripe"></div>

    <span class="sx-eyebrow">{{campaign_icon}}{{campaign_name}}</span>

    <div class="headline">
      Thank you to our<span class="tier">{{tier_label}}</span>
    </div>

    <div class="logo-tile">
      <img src="{{sponsor_logo}}" alt="" crossorigin="anonymous" />
    </div>

    <div class="sponsor-name">{{sponsor_name_html}}</div>

    <div class="impact-text">{{impact_text}}</div>

    <div class="bottom">
      <div class="cta">{{cta_text}}</div>
      <div class="stats">{{stats_html}}</div>
      <div class="sx-footer">
        <span class="gsi-wordmark">
          <span class="green-streets">Green Streets</span><span class="initiative"> Initiative</span>
        </span>
        <svg width="170" viewBox="0 0 125 40" xmlns="http://www.w3.org/2000/svg" style="display:block">
          <text x="0" y="30" font-family="'Bricolage Grotesque','Arial Black',sans-serif" font-weight="800" font-size="34" letter-spacing="-1.36" fill="#FFFFFF">Shift</text>
          <path d="M85,7 L101,20 L85,33 L85,26 L95,20 L85,14Z" fill="#BAF14D" />
          <path d="M104,7 L120,20 L104,33 L104,26 L114,20 L104,14Z" fill="#2966E5" />
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
